<div class="login-container">

    <div class="login-card">

        <div class="login-icon">
            <i class="bi bi-shield-lock"></i>
        </div>

        <h2>Laboratorium Teknologi Elektromedis</h2>

        <p class="text-muted">
            Sistem Internal Laboratorium
        </p>

        <div class="mb-3">
            <input
                type="password"
                id="sandi"
                class="form-control"
                placeholder="Masukkan sandi"
            >
        </div>

        <button
            class="btn btn-primary w-100"
            onclick="login()"
        >
            Masuk
        </button>

        <div id="pesanLogin" class="mt-3"></div>

    </div>

</div>
